[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "universal-downloader"
dynamic = ["version"]
description = "Desktop video and audio downloader built on yt-dlp and Qt, with a queue and plugins"
readme = "README.md"
license = "Unlicense"
license-files = ["LICENSE"]
authors = [{ name = "QuantumBoy-729" }]
keywords = ["yt-dlp", "video", "audio", "downloader", "gui", "qt", "pyside6", "youtube"]
requires-python = ">=3.10"
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: X11 Applications :: Qt",
    "Environment :: Win32 (MS Windows)",
    "Environment :: MacOS X",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Multimedia :: Sound/Audio",
    "Topic :: Multimedia :: Video",
]
# Floors are the oldest versions the test suite was run against.
dependencies = [
    "yt-dlp>=2025.3.31",
    "PySide6-Essentials>=6.6",
    "imageio-ffmpeg>=0.5",
]

[project.urls]
Homepage = "https://github.com/QuantumBoy-729/YT-videoDownloader"
Source = "https://github.com/QuantumBoy-729/YT-videoDownloader"
Issues = "https://github.com/QuantumBoy-729/YT-videoDownloader/issues"
Changelog = "https://github.com/QuantumBoy-729/YT-videoDownloader/blob/main/CHANGELOG.md"

[project.optional-dependencies]
dev = ["pytest>=8"]
build = ["pyinstaller>=6.6"]

[project.gui-scripts]
universal-downloader = "universal_downloader.ui.app:main"

[tool.setuptools.dynamic]
version = { attr = "universal_downloader.__version__" }

[tool.setuptools.packages.find]
include = ["universal_downloader*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
