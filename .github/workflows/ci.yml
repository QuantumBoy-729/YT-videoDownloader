name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

permissions:
  contents: read

jobs:
  test:
    name: Test (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Install system libraries for Qt and ffmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3
      - run: pip install -e ".[dev]"
      - run: pytest -q
        env:
          QT_QPA_PLATFORM: offscreen
      - name: Self-check
        run: universal-downloader --smoke-test
        env:
          QT_QPA_PLATFORM: offscreen

  # Windows is where the program is built and used, so run the tests there too.
  # Not blocking yet: the suite has only been run on Linux so far. Once it has
  # passed here, remove continue-on-error.
  test-windows:
    name: Test (Windows)
    runs-on: windows-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - run: pytest -q
        env:
          QT_QPA_PLATFORM: offscreen

  package:
    name: Build packages
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Tag must match the package version
        if: github.ref_type == 'tag'
        run: |
          version=$(python -c "import re; print(re.search(r'__version__ = \"([^\"]+)\"', open('universal_downloader/__init__.py').read()).group(1))")
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match version $version in universal_downloader/__init__.py"
            exit 1
          fi
      - run: pip install build twine
      - run: python -m build
      - run: twine check dist/*
      - name: Install the wheel in a clean environment and run the self-check
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3
          python -m venv "$RUNNER_TEMP/clean"
          "$RUNNER_TEMP/clean/bin/pip" install dist/*.whl
          cd "$RUNNER_TEMP"
          QT_QPA_PLATFORM=offscreen "$RUNNER_TEMP/clean/bin/universal-downloader" --smoke-test
      - uses: actions/upload-artifact@v4
        with:
          name: python-packages
          path: dist/

  windows-exe:
    name: Build Windows program
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install ".[build]"
      - run: python packaging/build.py
      - name: Self-check the program
        shell: pwsh
        run: |
          $env:UD_SMOKE_LOG = Join-Path $PWD "smoke.log"
          $p = Start-Process -FilePath dist\UniversalDownloader.exe -ArgumentList "--smoke-test" -PassThru -Wait
          if (Test-Path $env:UD_SMOKE_LOG) { Get-Content $env:UD_SMOKE_LOG } else { Write-Host "The program wrote no report." }
          if ($p.ExitCode -ne 0) { throw "Self-check failed with exit code $($p.ExitCode)" }
      - uses: actions/upload-artifact@v4
        with:
          name: UniversalDownloader-windows
          path: dist/UniversalDownloader.exe

  release:
    name: GitHub release
    if: github.ref_type == 'tag'
    needs: [package, windows-exe]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/UniversalDownloader.exe
            artifacts/*.whl
            artifacts/*.tar.gz
          generate_release_notes: true

  pypi:
    name: Publish to PyPI
    # Off until PUBLISH_TO_PYPI is set to "true"; see RELEASING.md.
    if: github.ref_type == 'tag' && vars.PUBLISH_TO_PYPI == 'true'
    needs: package
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: python-packages
          path: dist
      - uses: pypa/gh-action-pypi-publish@release/v1
