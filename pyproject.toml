[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "yt-downloader"
dynamic = ["version"]
description = "Desktop video and audio downloader built on yt-dlp and Qt"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
dependencies = [
    "yt-dlp>=2025.1.15",
    "PySide6-Essentials>=6.6",
    "imageio-ffmpeg>=0.5",
]

[project.optional-dependencies]
dev = ["pytest>=8"]
build = ["pyinstaller>=6.6"]

[project.gui-scripts]
yt-downloader = "yt_downloader.ui.app:main"

[tool.setuptools.dynamic]
version = { attr = "yt_downloader.__version__" }

[tool.setuptools.packages.find]
include = ["yt_downloader*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
